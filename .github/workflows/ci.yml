name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  foundry:
    name: Contract fuzz and invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std@v1.9.7 --no-git
      - run: forge test -vv

  slither:
    name: Slither (contracts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contracts
          slither-args: --filter-paths "test/"
          fail-on: none
          sarif: results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mythril:
    name: Mythril (contracts, symbolic execution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Solidity 0.8.28 from the official release
        run: |
          curl -fsSL -o solc https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          chmod +x solc && ./solc --version
      - name: Analyze each contract
        run: |
          mkdir -p mythril
          failed=0
          for c in src/vault/AgentVault.sol:AgentVault src/vault/AgentVaultFactory.sol:AgentVaultFactory src/vault/adapters/UniswapV3Adapter.sol:UniswapV3Adapter src/ReceiptRegistry.sol:ReceiptRegistry; do
            name="${c##*:}"
            echo "::group::$name"
            docker run --rm -v "$PWD/contracts:/src" -v "$PWD/solc:/usr/bin/solc:ro" -v "$PWD/solc:/usr/local/bin/solc:ro" -w /src --entrypoint myth mythril/myth               analyze "$c" --execution-timeout 300 -o markdown > "mythril/$name.md" 2>&1 || true
            cat "mythril/$name.md"
            echo "::endgroup::"
            # Findings are reported, not fatal; a run that could not analyze is.
            if grep -qE "Traceback|\[ERROR\]|Solc experienced a fatal error" "mythril/$name.md"; then echo "::error::Mythril could not analyze $name"; failed=1; fi
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythril-report
          path: mythril/
